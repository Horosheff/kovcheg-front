name: lockdown

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-exe.yml"

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete public releases and hide repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo Horosheff/kovcheg-front --limit 100 || true
          for tag in v1.9.78 v1.9.77 v1.9.76 src-1.9.77; do
            gh release delete "$tag" --repo Horosheff/kovcheg-front --yes || true
            git push origin --delete "$tag" || true
          done
          gh api -X PATCH repos/Horosheff/kovcheg-front -f private=true -f visibility=private || true
